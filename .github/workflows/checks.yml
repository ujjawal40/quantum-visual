# Checks on every push and pull request:
#   physics unit tests, a browser load of every page, and every Python lab run top to bottom.
name: Checks

on:
  push:
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: node tests/smoke.mjs

  labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt nbconvert ipykernel
      - name: Run every notebook
        run: |
          for nb in labs/*/*.ipynb; do
            echo "::group::$nb"
            (cd "$(dirname "$nb")" && jupyter nbconvert --to notebook --execute --stdout "$(basename "$nb")" > /dev/null)
            echo "::endgroup::"
          done

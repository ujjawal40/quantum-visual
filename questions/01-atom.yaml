- id: m1-q8
  lesson: "1.4"
  level: challenge
  type: numeric
  prompt: >
    Add up the masses of 6 protons, 6 neutrons and 6 electrons. Carbon-12 is
    defined as exactly 12 u (1 u = 1.6605 × 10⁻²⁷ kg). How much mass is
    "missing", and where did it go?
  answer: "about 0.099 u; it became the binding energy of the nucleus"
  solution: >
    Sum = 2.0091 × 10⁻²⁶ kg = 12.099 u. The 0.099 u difference is the mass
    defect: binding the nucleons together released energy E = Δm c²
    (about 92 MeV).

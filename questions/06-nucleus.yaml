# Question bank, Module 6. Each item: id, lesson, level (core|extension|challenge),
# type (concept|numeric|python), prompt, answer, and optional worked solution.

- id: m6-q1
  lesson: "6.4"
  level: core
  type: numeric
  prompt: >
    A sample has a half-life of 5 days. What fraction remains after 20 days?
  answer: "1/16 (6.25%)"
  solution: 20 days is 4 half-lives, so (½)⁴ = 1/16.

- id: m6-q2
  lesson: "6.4"
  level: core
  type: concept
  prompt: >
    A nucleus with a half-life of 1 hour has already survived 5 hours. What is
    the chance it decays in the next hour?
  answer: "50%"
  solution: >
    Nuclei do not age. Each half-life every surviving nucleus faces the same
    50% chance, whatever has happened before.

- id: m6-q3
  lesson: "6.4"
  level: core
  type: numeric
  prompt: >
    A bone has 25% of its carbon-14 left. Carbon-14's half-life is 5,730
    years. How old is the bone?
  answer: "11,460 years"
  solution: 25% is two halvings, so 2 × 5,730 = 11,460 years.

- id: m6-q4
  lesson: "6.4"
  level: extension
  type: numeric
  prompt: >
    Find the decay constant λ of iodine-131 (half-life 8.02 days) in s⁻¹.
  answer: "1.0 × 10⁻⁶ s⁻¹"
  solution: >
    λ = ln 2 / T½ = 0.693 / (8.02 × 86,400 s) = 1.00 × 10⁻⁶ s⁻¹.

- id: m6-q5
  lesson: "6.4"
  level: extension
  type: numeric
  prompt: >
    A wooden beam has 70% of its carbon-14 left. How old is it?
  answer: "about 2,950 years"
  solution: t = 5,730 × log₂(1/0.70) = 5,730 × 0.515 ≈ 2,950 years.


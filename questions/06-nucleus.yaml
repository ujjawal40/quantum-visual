- id: m6-q7
  lesson: "6.4"
  level: challenge
  type: concept
  prompt: >
    Uranium-238 has a half-life of 4.47 billion years, close to the age of the
    Earth. Roughly what fraction of the Earth's original uranium-238 is left,
    and why is radioactive dating of rocks reliable even though each decay is
    random?
  answer: >
    About half. Each decay is random, but a rock holds around 10²⁰ uranium
    nuclei, so the statistical scatter is about 1 part in 10¹⁰ and the
    exponential law holds almost exactly.

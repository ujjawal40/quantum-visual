- id: m2-q7
  lesson: "2.4"
  level: challenge
  type: numeric
  prompt: >
    A 1 mW violet laser (405 nm) shines on caesium. If 10% of photons free an
    electron, what current flows when nothing is stopping the electrons?
  answer: "about 33 µA"
  solution: >
    Photon energy = 1240 ÷ 405 = 3.06 eV = 4.9 × 10⁻¹⁹ J. Photons per second
    = 10⁻³ ÷ 4.9 × 10⁻¹⁹ ≈ 2.0 × 10¹⁵. Electrons per second = 2.0 × 10¹⁴, so
    I = 2.0 × 10¹⁴ × 1.6 × 10⁻¹⁹ ≈ 3.3 × 10⁻⁵ A.

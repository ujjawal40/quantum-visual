- id: m3-q5
  lesson: "3.5"
  level: challenge
  type: concept
  prompt: Why does gold look yellow while silver looks white?
  answer: >
    Gold's inner electrons move at a large fraction of c, so relativistic
    effects shift its 5d→6s absorption into the blue; gold reflects red and
    yellow light. In silver the same gap stays in the ultraviolet.

- id: m4-q7
  lesson: "4.3"
  level: challenge
  type: numeric
  prompt: >
    A 57 g tennis ball at 20 m/s passes through two gaps 10 cm apart in a
    fence, 5 m from a wall. Estimate its fringe spacing. Could it ever be seen?
  answer: "about 3 × 10⁻³² m: far smaller than a proton, so never observable"
  solution: >
    λ = h / mv = 6.63 × 10⁻³⁴ / (0.057 × 20) = 5.8 × 10⁻³⁴ m.
    Δy = λL/d = 5.8 × 10⁻³⁴ × 5 / 0.10 = 2.9 × 10⁻³² m.
